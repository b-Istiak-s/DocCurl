<!doctype html>
<html>
  <head>
    <title>DocCurl</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlightjs-line-numbers.js/2.8.0/highlightjs-line-numbers.min.js"></script>
  </head>
  <body>
    <div id="appShell">
      <div id="mobileTopbar">
        <button id="mobileMenuButton" class="ghostButton" type="button">
          Docs
        </button>
        <span class="appTitle">DocCurl</span>
      </div>
      <aside id="sidebar">
        <div class="sidebarHeader">
          <h2>Docs</h2>
          <button
            id="sidebarCloseButton"
            class="ghostButton sidebarClose"
            type="button"
            aria-label="Close navigation"
          >
            ×
          </button>
        </div>
        <ul id="docList"></ul>
      </aside>
      <div id="sidebarBackdrop"></div>
      <main id="content">
        <div id="docContent"></div>
      </main>
    </div>

    <div id="fullscreenModal" hidden>
      <div id="fullscreenContent">
        <button
          id="fullscreenCloseButton"
          type="button"
          aria-label="Exit fullscreen"
        >
          ×
        </button>
        <div id="fullscreenMount"></div>
      </div>
    </div>

    <div id="authModal" hidden>
      <div id="authCard">
        <h3>Enter Password</h3>
        <p id="authHelpText">This DocCurl project is protected.</p>
        <form id="authForm">
          <input
            id="authPasswordInput"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
            required
          />
          <button id="authSubmitButton" type="submit">Unlock</button>
        </form>
        <p id="authError" class="authError"></p>
      </div>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
